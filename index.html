<script>
window.__boot.then(() => {
const KEY='mini_shop_management_web_v1';
const defaults=()=>({settings:{shopName:'My Shop',currency:'RM',taxRate:0},products:[],customers:[{id:1,name:'Walk-in Customer',phone:'',email:'',notes:''}],suppliers:[],sales:[],invoices:[],customerPayments:[],purchaseOrders:[],supplierBills:[],supplierPayments:[],stockMovements:[],next:{product:1,customer:2,supplier:1,sale:1,invoice:1,payment:1,po:1,bill:1,spayment:1,movement:1}});

if(!storageAvailable){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');storageAvailable=true;}catch(e){}}

let idx=null;
function genSku(name,id){const base=String(name||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3).padEnd(3,'X');let n=Number(id)||1,sku;do{sku=base+'-'+String(n).padStart(4,'0');n++;}while(db.products.some(x=>x.sku&&x.sku.toLowerCase()===sku.toLowerCase()));return sku;}
function fillSkus(){db.products.forEach(p=>{if(!p.sku)p.sku=genSku(p.name,p.id);});}
function ix(){if(idx)return idx;const inv=new Map(),bill=new Map();for(const p of db.customerPayments)inv.set(p.invoiceId,(inv.get(p.invoiceId)||0)+p.amount);for(const p of db.supplierPayments)bill.set(p.billId,(bill.get(p.billId)||0)+p.amount);return idx={inv,bill};}
function fixCounters(){const mx=a=>a.reduce((m,x)=>Math.max(m,Number(x.id)||0),0),n=db.next;n.product=Math.max(n.product,mx(db.products)+1);n.customer=Math.max(n.customer,mx(db.customers)+1);n.supplier=Math.max(n.supplier,mx(db.suppliers)+1);n.sale=Math.max(n.sale,mx(db.sales)+1);n.invoice=Math.max(n.invoice,mx(db.invoices)+1);n.payment=Math.max(n.payment,mx(db.customerPayments)+1);n.po=Math.max(n.po,mx(db.purchaseOrders)+1);n.bill=Math.max(n.bill,mx(db.supplierBills)+1);n.spayment=Math.max(n.spayment,mx(db.supplierPayments)+1);n.movement=Math.max(n.movement,mx(db.stockMovements)+1);}

normalize();fixCounters();fillSkus();
function save(){idx=null;const ok=store.set(KEY,JSON.stringify(db));if(!ok){const note=document.getElementById('storageWarning');if(note)note.hidden=false;}return ok;}
function money(cents){return `${db.settings.currency||'RM'} ${(Number(cents||0)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}`;}
function cents(v){const n=Number(v);return Number.isFinite(n)?Math.round(n*100):0;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dateTime(v){try{return new Date(v).toLocaleString();}catch(e){return v||'';}}
function dateOnly(v){try{return new Date(v).toLocaleDateString();}catch(e){return v||'';}}
function uid(type){const n=db.next[type]||1;db.next[type]=n+1;return n;}
let toastT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3200);}
function ymd(v){const x=new Date(v);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function customerDue(id){return db.invoices.reduce((a,i)=>i.customerId===id?a+invDue(i):a,0);}
function activeProducts(){return db.products.filter(p=>!p.archived);}
function productBy(id){return db.products.find(p=>p.id===Number(id));}
function customerBy(id){return db.customers.find(c=>c.id===Number(id));}
function supplierBy(id){return db.suppliers.find(s=>s.id===Number(id));}
function invoiceBy(id){return db.invoices.find(i=>i.id===Number(id));}
function salePaid(saleId){return db.customerPayments.filter(p=>p.saleId===saleId).reduce((a,p)=>a+p.amount,0);}
function invPaid(inv){return ix().inv.get(inv.id)||0;}
function billPaid(bill){return ix().bill.get(bill.id)||0;}
function invDue(inv){return Math.max(0,inv.total-invPaid(inv));}
function billDue(b){return Math.max(0,b.total-billPaid(b));}
function logStock(productId,delta,reason,ref){db.stockMovements.push({id:uid('movement'),productId,delta,reason,ref:ref||'',at:new Date().toISOString()});}
function badge(text,kind='blue'){return `<span class="badge ${kind}">${esc(text)}</span>`;}
function emptyRow(n,msg='No records yet.'){return `<tr><td colspan="${n}" class="empty">${esc(msg)}</td></tr>`;}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`;}
const pageNames={dashboard:'Dashboard',checkout:'Checkout / Sales',products:'Products & Inventory',invoices:'Invoices & Payments',purchases:'Purchase Orders',suppliers:'Suppliers & Bills',customers:'Customers',reports:'Reports',settings:'Settings & Backup'};
let currentPage='dashboard';
function navigate(page){if(page==='settings'&&session&&session.role==='user')page='dashboard';currentPage=page;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('topTitle').textContent=pageNames[page]||'Mini Shop';render();}
function closeMobileNav(){document.querySelector('.sidebar').classList.remove('mobile-open');document.getElementById('navScrim').classList.remove('open');document.getElementById('mobileMenu').setAttribute('aria-expanded','false');document.getElementById('mobileMenu').setAttribute('aria-label','Open navigation');}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>{navigate(b.dataset.page);closeMobileNav();}));
document.getElementById('mobileMenu').addEventListener('click',()=>{const side=document.querySelector('.sidebar'),open=!side.classList.contains('mobile-open');side.classList.toggle('mobile-open',open);document.getElementById('navScrim').classList.toggle('open',open);document.getElementById('mobileMenu').setAttribute('aria-expanded',String(open));document.getElementById('mobileMenu').setAttribute('aria-label',open?'Close navigation':'Open navigation');});

function pageHead(title,desc,action=''){return `<div class="page-head"><div><h2>${title}</h2><p>${desc}</p></div>${action}</div>`;}
function stat(label,value,note,icon){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`;}
function renderDashboard(){

const allSales=db.sales.reduce((a,s)=>a+(s.subtotal??s.total),0),pct=Math.max(0,Math.min(100,allSales?gross/allSales*100:0));
const recent=[...db.sales].sort((a,b)=>b.id-a.id).slice(0,6).map(s=>`<tr><td><strong>#${s.id}</strong></td><td>${esc(s.customerName)}</td><td>${dateOnly(s.at)}</td><td>${money(s.total)}</td><td>${badge(s.status==='PAID'?'Paid':s.status==='PARTIAL'?'Partial':'Unpaid',s.status==='PAID'?'green':s.status==='PARTIAL'?'amber':'red')}</td></tr>`).join('');
const lowRows=low.slice(0,6).map(p=>`<div class="mini-row"><div><strong>${esc(p.name)}</strong><small>Stock ${p.stock} · Alert at ${p.lowStock}</small></div>${badge(p.stock===0?'Out of stock':'Low stock',p.stock===0?'red':'amber')}</div>`).join('')||`<div class="empty">No low-stock products. Nice work!</div>`;
return `${pageHead(`Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'} 👋`,`${esc(db.settings.shopName)} · ${new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})}`)}
<div class="grid stats">${stat("Today's sales",money(todayTotal),`${todaySales.length} transaction(s) today`,'↗')}${stat('Sales this month',money(monthTotal),`${monthSales.length} transaction(s) this month`,'▥')}${stat('Customer balances due',money(outstanding),`${db.invoices.filter(i=>invDue(i)>0).length} unpaid invoice(s)`,'◷')}${stat('Stock at cost value',money(stockValue),`${db.products.length} product(s) tracked`,'▤')}</div>
<div class="grid quick-grid" style="margin-bottom:20px"><button class="quick" data-action="go-checkout"><span class="quick-icon">🛒</span><span><strong>New sale</strong><small>Checkout a customer</small></span></button><button class="quick" data-action="add-product"><span class="quick-icon">＋</span><span><strong>Add product</strong><small>Set price and stock</small></span></button><button class="quick" data-action="add-purchase"><span class="quick-icon">📦</span><span><strong>New purchase order</strong><small>Restock products</small></span></button><button class="quick" data-action="go-reports"><span class="quick-icon">▥</span><span><strong>View reports</strong><small>Sales and profit</small></span></button></div>
<div class="grid columns"><section class="card"><div class="card-head"><div><h3>Recent sales</h3><p>Latest completed transactions</p></div><button class="btn small" data-action="go-checkout">Open sales</button></div>${table(['Sale','Customer','Date','Total','Payment'],recent||emptyRow(5))}</section><section class="card"><div class="card-head"><div><h3>Inventory alerts</h3><p>Products that need attention</p></div><button class="btn small" data-action="go-products">Inventory</button></div><div class="card-body"><div class="mini-list">${lowRows}</div></div></section></div>
<div class="grid two-col"><section class="card"><div class="card-head"><div><h3>Estimated performance</h3><p>Gross profit estimate before overheads</p></div></div><div class="card-body"><div class="mini-row"><span class="muted">Estimated gross profit, all time</span><strong>${money(gross)}</strong></div><div class="progress"><span style="width:${pct}%"></span></div><div class="mini-row" style="margin-top:16px"><span class="muted">Supplier balances due</span><strong>${money(supplierDue)}</strong></div></div></section><section class="card"><div class="card-head"><div><h3>Business snapshot</h3><p>Current records</p></div></div><div class="card-body mini-list"><div class="mini-row"><span>Customers</span><strong>${db.customers.length}</strong></div><div class="mini-row"><span>Suppliers</span><strong>${db.suppliers.length}</strong></div><div class="mini-row"><span>Purchase orders</span><strong>${db.purchaseOrders.length}</strong></div><div class="mini-row"><span>Invoices issued</span><strong>${db.invoices.length}</strong></div></div></section></div>
<div class="footer-note">Gross profit is estimated from product cost entered at the time of sale. It does not include rent, wages, tax, or other overheads.</div>`;
}

ase order has not been received yet, so a supplier bill has not been generated.'}</p>`}</div></details>`}).join('')||'<div class="empty">No purchase orders recorded yet.</div>'}</div></div><div class="mini-row" style="margin-top:18px"><span>Payments made to suppliers (all)</span><strong>${money(supplierPaid)}</strong></div></div></section>

const PINKEY='mini_shop_pin';
function pinData(){try{return JSON.parse(localStorage.getItem(PINKEY)||'null');}catch(e){return null;}}
async function pinHash(pin,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
let pinFails=0,lockedUntil=0,hiddenAt=0;
const lockEl=document.createElement('div');lockEl.id='lockScreen';
lockEl.style.cssText='position:fixed;inset:0;z-index:10000;background:#111a2d;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center';
lockEl.innerHTML='<div style="font-size:42px">\uD83D\uDD12</div><h2 style="margin:0">Mini Shop is locked</h2><p id="lockMsg" style="margin:0;color:#aab5ca">Enter your PIN</p><input id="lockInput" type="password" inputmode="numeric" autocomplete="off" maxlength="6" style="font-size:28px;letter-spacing:10px;text-align:center;width:220px;padding:12px;border-radius:12px;border:0"><button id="lockBtn" class="btn primary" style="width:220px;justify-content:center">Unlock</button>';
document.body.appendChild(lockEl);
function lockMsg(t){document.getElementById('lockMsg').textContent=t;}
function showLock(){if(!pinData()||authData())return;lockEl.style.display='flex';const i=document.getElementById('lockInput');i.value='';lockMsg('Enter your PIN');setTimeout(()=>i.focus(),50);}
async function tryUnlock(){const d=pinData(),i=document.getElementById('lockInput');if(!d){lockEl.style.display='none';return;}
 const now=Date.now();if(now<lockedUntil){lockMsg('Too many tries. Wait '+Math.ceil((lockedUntil-now)/1000)+' s.');i.value='';return;}
 let ok=false;try{ok=(await pinHash(i.value,d.salt))===d.hash;}catch(e){}
 i.value='';if(ok){pinFails=0;lockEl.style.display='none';}else{pinFails++;if(pinFails>=5){pinFails=0;lockedUntil=Date.now()+30000;lockMsg('Too many tries. Wait 30 s.');}else lockMsg('Wrong PIN. Try again.');}}
document.getElementById('lockBtn').onclick=tryUnlock;
document.getElementById('lockInput').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock();});
document.getElementById('lockInput').addEventListener('input',e=>{const d=pinData();if(d&&e.target.value.length===d.len)tryUnlock();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(pinData()&&hiddenAt&&Date.now()-hiddenAt>60000)showLock();});
function numPad(){document.querySelectorAll('#modalBody input').forEach(i=>{i.inputMode='numeric';i.maxLength=6;i.autocomplete='off';});}
function pinSet(){if(!window.crypto||!crypto.subtle){toast('PIN needs a secure connection (https).');return;}const cur=pinData();
 openModal(cur?'Change PIN':'Set PIN',(cur?field('Current PIN','cur','password','',{required:true}):'')+field('New PIN (4 to 6 digits)','np','password','',{required:true})+field('Confirm new PIN','cp','password','',{required:true}),'Save PIN',fd=>{
  const cv=String(fd.get('cur')||'').trim(),np=String(fd.get('np')||'').trim(),cp=String(fd.get('cp')||'').trim();
  if(!/^\d{4,6}$/.test(np)){toast('PIN must be 4 to 6 digits.');return false;}
  if(np!==cp){toast('The two PINs do not match.');return false;}
  (async()=>{try{if(cur&&(await pinHash(cv,cur.salt))!==cur.hash){toast('Current PIN is wrong.');return;}
   const salt=Array.from(crypto.getRandomValues(new Uint8Array(8))).map(x=>x.toString(16).padStart(2,'0')).join('');
   localStorage.setItem(PINKEY,JSON.stringify({salt,hash:await pinHash(np,salt),len:np.length}));closeModal();render();toast('PIN saved.');}catch(e){toast('Could not save the PIN on this device.');}})();
  return false;});numPad();}
function pinRemove(){const cur=pinData();if(!cur)return;
 openModal('Remove PIN',field('Enter your PIN to remove the lock','cur','password','',{required:true}),'Remove PIN',fd=>{const cv=String(fd.get('cur')||'').trim();
  (async()=>{try{if((await pinHash(cv,cur.salt))!==cur.hash){toast('Wrong PIN.');return;}localStorage.removeItem(PINKEY);closeModal();render();toast('PIN removed.');}catch(e){toast('Could not remove the PIN.');}})();return false;});numPad();}
showLock();
const AUTHKEY='mini_shop_auth',SESSKEY='mini_shop_session';let session=null;
function authData(){try{return JSON.parse(localStorage.getItem(AUTHKEY)||'null');}catch(e){return null;}}
function authSave(d){localStorage.setItem(AUTHKEY,JSON.stringify(d));}
function nowMs(){const d=authData(),n=Math.max(Date.now(),(d&&d.lastSeen)||0);if(d&&n>(d.lastSeen||0)){d.lastSeen=n;try{authSave(d);}catch(e){}}return n;}
function hex(b){return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function rnd(n){return hex(crypto.getRandomValues(new Uint8Array(n)));}
function norm(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function recCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(16));let o='';for(let i=0;i<16;i++){o+=a[r[i]%a.length];if(i%4===3&&i<15)o+='-';}return o;}
async function pw(pass,salt){const enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},k,256));}
function leftTxt(ms){if(ms<=0)return 'Expired';const m=Math.floor(ms/60000);if(m<60)return m+' min left';const h=Math.floor(m/60);if(h<48)return h+'h '+(m%60)+'m left';return Math.floor(h/24)+' days left';}
function sessionOK(){const d=authData();if(!d||!session)return false;if(session.role==='admin')return !!d.admin;const u=d.users.find(x=>x.id===session.uid);return !!u&&nowMs()<u.expires;}
function saveSession(){try{sessionStorage.setItem(SESSKEY,JSON.stringify(session));}catch(e){}}

const FS='display:flex;flex-direction:column;gap:10px;align-items:center';
const loginEl=document.createElement('div');loginEl.id='loginScreen';
loginEl.style.cssText='position:fixed;inset:0;z-index:10001;background:#111a2d;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;overflow:auto';
loginEl.innerHTML='<div style="font-size:42px">\uD83D\uDD12</div><h2 style="margin:0">Mini Shop</h2><p id="lgMsg" style="margin:0;color:#aab5ca;max-width:300px">Sign in to continue</p>'
+'<div id="lgForm" style="'+FS+'"><input id="lgUser" placeholder="Username" autocomplete="username" autocapitalize="none" style="'+IS+'"><input id="lgPass" type="password" placeholder="Password" autocomplete="current-password" style="'+IS+'"><button id="lgBtn" class="btn primary" style="width:260px;justify-content:center">Sign in</button><a href="#" id="lgForgot" style="color:#9db4ff">Forgot password? (admin)</a></div>'

const gv=id=>document.getElementById(id).value;
function lgMsg(t){document.getElementById('lgMsg').textContent=t;}
function showLogin(msg){closeModal();loginEl.style.display='flex';document.getElementById('lgForm').style.display='flex';document.getElementById('fgForm').style.display='none';['lgUser','lgPass','fgCode','fgUser','fgPass','fgPass2'].forEach(i=>document.getElementById(i).value='');lgMsg(msg||'Sign in to continue');setTimeout(()=>document.getElementById('lgUser').focus(),50);}
function hideLogin(){loginEl.style.display='none';applyRole();navigate(currentPage);}
function signOut(msg){session=null;try{sessionStorage.removeItem(SESSKEY);}catch(e){}applyRole();showLogin(msg);}
function throttled(){const n=Date.now();if(n<lockedUntil){lgMsg('Too many tries. Wait '+Math.ceil((lockedUntil-n)/1000)+' s.');return true;}return false;}
function failTry(m){pinFails++;if(pinFails>=5){pinFails=0;lockedUntil=Date.now()+30000;lgMsg('Too many tries. Wait 30 s.');}else lgMsg(m);}
async function doLogin(){const d=authData();if(!d){loginEl.style.display='none';return;}if(throttled())return;
 const u=gv('lgUser').trim(),p=gv('lgPass');if(!u||!p){lgMsg('Enter your username and password.');return;}
 try{if(d.admin&&u.toLowerCase()===d.admin.user.toLowerCase()){if((await pw(p,d.admin.salt))===d.admin.hash){pinFails=0;session={role:'admin',name:d.admin.user};saveSession();hideLogin();return;}}
 else{const t=d.users.find(x=>x.name.toLowerCase()===u.toLowerCase());if(t&&(await pw(p,t.salt))===t.hash){if(nowMs()>=t.expires){lgMsg('This temporary access has expired. Ask the admin for new access.');return;}pinFails=0;session={role:'user',name:t.name,uid:t.id};saveSession();hideLogin();return;}}}catch(e){}
 failTry('Wrong username or password.');}
async function doForgot(){const d=authData();if(!d||throttled())return;const code=norm(gv('fgCode')),u=gv('fgUser').trim(),p=gv('fgPass'),p2=gv('fgPass2');
 if(!code){lgMsg('Enter your recovery code.');return;}
 if(u.length<3||p.length<6||p!==p2){lgMsg('Username needs 3+ characters, password 6+, and both passwords must match.');return;}
 if(d.users.some(x=>x.name.toLowerCase()===u.toLowerCase())){lgMsg('That username belongs to a temporary user.');return;}
 let ok=false;try{ok=(await pw(code,d.recovery.salt))===d.recovery.hash;}catch(e){}
 if(!ok){failTry('That recovery code is not correct.');return;}
 try{const salt=rnd(8),nc=recCode(),rs=rnd(8);d.admin={user:u,salt,hash:await pw(p,salt)};d.recovery={salt:rs,hash:await pw(norm(nc),rs)};authSave(d);pinFails=0;session={role:'admin',name:u};saveSession();hideLogin();showRecovery(nc);}catch(e){lgMsg('Could not save the new login.');}}
document.getElementById('lgBtn').onclick=doLogin;document.getElementById('fgBtn').onclick=doForgot;
document.getElementById('lgForgot').onclick=e=>{e.preventDefault();document.getElementById('lgForm').style.display='none';document.getElementById('fgForm').style.display='flex';lgMsg('Enter the recovery code you saved when you created the admin account. Temporary users must ask the admin.');};
document.getElementById('fgBack').onclick=e=>{e.preventDefault();showLogin();};
['lgUser','lgPass'].forEach(i=>document.getElementById(i).addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();}));
['fgCode','fgUser','fgPass','fgPass2'].forEach(i=>document.getElementById(i).addEventListener('keydown',e=>{if(e.key==='Enter')doForgot();}));
const soBtn=document.createElement('button');soBtn.id='signOutBtn';soBtn.className='btn';soBtn.textContent='Sign out';soBtn.style.display='none';soBtn.onclick=()=>signOut();document.querySelector('.top-actions').appendChild(soBtn);
function applyRole(){const d=authData(),pill=document.querySelector('.user-pill'),isUser=!!(session&&session.role==='user');
 document.querySelectorAll('[data-page="settings"]').forEach(b=>b.style.display=isUser?'none':'');
 document.querySelectorAll('.navlabel').forEach(l=>{if(l.textContent.trim()==='DATA')l.style.display=isUser?'none':'';});
 const ex=document.getElementById('topExport');if(ex)ex.style.display=isUser?'none':'';
 if(d&&session){let t='\u25CF '+session.name+(isUser?'':' (admin)');if(isUser){const u=d.users.find(x=>x.id===session.uid);if(u)t+=' \u00B7 '+leftTxt(u.expires-nowMs());}if(pill)pill.textContent=t;soBtn.style.display='';}
 else{if(pill)pill.textContent='\u25CF Local workspace';soBtn.style.display='none';}}
document.addEventListener('click',e=>{if(!session||session.role!=='user')return;if(e.target.closest('#topExport,[data-page="settings"],[data-action^="export"],[data-action^="delete-"],[data-action="reset-data"]')){e.preventDefault();e.stopPropagation();toast('Only the admin can do this.');}},true);
setInterval(()=>{if(!authData())return;if(session&&!sessionOK())signOut(session.role==='user'?'Your temporary access has ended.':'');else applyRole();},30000);
document.addEventListener('visibilitychange',()=>{if(!authData()||!session)return;if(document.hidden){try{sessionStorage.setItem('mini_shop_hidden',String(Date.now()));}catch(e){}return;}
 let h=0;try{h=Number(sessionStorage.getItem('mini_shop_hidden'))||0;}catch(e){}
 if(!sessionOK())signOut(session.role==='user'?'Your temporary access has ended.':'');else if(h&&Date.now()-h>300000)signOut('Signed out after being away for a while.');});
function showRecovery(code){openModal('Save your recovery code','<div class="invoice-box"><p>If you ever forget your admin password, this code lets you reset it from the sign-in screen. It is shown only once, so write it down or screenshot it and keep it private.</p><p style="font-size:24px;font-weight:700;letter-spacing:2px;text-align:center;margin:16px 0">'+code+'</p><p class="muted">You can create a new code at any time in Settings.</p></div>','I have saved it',()=>true);}
function needCrypto(){if(!window.crypto||!crypto.subtle){toast('Login needs a secure connection (https).');return true;}return false;}
function authCreate(){if(needCrypto())return;
 openModal('Create admin account',field('Admin username','u','text','',{required:true})+field('Password (min 6 characters)','p','password','',{required:true})+field('Confirm password','c','password','',{required:true}),'Create admin',fd=>{
  const u=String(fd.get('u')||'').trim(),p=String(fd.get('p')||''),c=String(fd.get('c')||'');
  if(u.length<3){toast('Username needs at least 3 characters.');return false;}if(p.length<6){toast('Password needs at least 6 characters.');return false;}if(p!==c){toast('The two passwords do not match.');return false;}
  (async()=>{try{const salt=rnd(8),code=recCode(),rs=rnd(8);authSave({admin:{user:u,salt,hash:await pw(p,salt)},recovery:{salt:rs,hash:await pw(norm(code),rs)},users:[],lastSeen:Date.now()});
   try{localStorage.removeItem(PINKEY);}catch(e){}session={role:'admin',name:u};saveSession();closeModal();applyRole();render();showRecovery(code);}catch(e){toast('Could not save the login on this device.');}})();return false;});}
function authChange(){const d=authData();if(!d||needCrypto())return;
 openModal('Change admin login',field('Current password','cp','password','',{required:true})+field('Admin username','u','text',d.admin.user,{required:true})+field('New password (leave blank to keep)','np','password','')+field('Confirm new password','nc','password',''),'Save changes',fd=>{
  const cp=String(fd.get('cp')||''),nu=String(fd.get('u')||'').trim(),np=String(fd.get('np')||''),nc=String(fd.get('nc')||'');
  if(nu.length<3){toast('Username needs at least 3 characters.');return false;}if(np&&np.length<6){toast('New password needs at least 6 characters.');return false;}if(np!==nc){toast('The new passwords do not match.');return false;}
  (async()=>{try{const x=authData();if((await pw(cp,x.admin.salt))!==x.admin.hash){toast('Current password is wrong.');return;}
   if(x.users.some(t=>t.name.toLowerCase()===nu.toLowerCase())){toast('That username belongs to a temporary user.');return;}
   x.admin.user=nu;if(np){x.admin.salt=rnd(8);x.admin.hash=await pw(np,x.admin.salt);}authSave(x);session={role:'admin',name:nu};saveSession();closeModal();applyRole();render();toast('Admin login updated.');}catch(e){toast('Could not update the login.');}})();return false;});}
function authRecoveryNew(){const d=authData();if(!d||needCrypto())return;
 openModal('New recovery code',field('Enter your admin password to create a new recovery code. The old code stops working.','cp','password','',{required:true}),'Create code',fd=>{const cp=String(fd.get('cp')||'');
  (async()=>{try{const x=authData();if((await pw(cp,x.admin.salt))!==x.admin.hash){toast('Password is wrong.');return;}const code=recCode(),rs=rnd(8);x.recovery={salt:rs,hash:await pw(norm(code),rs)};authSave(x);closeModal();showRecovery(code);}catch(e){toast('Could not create a new code.');}})();return false;});}
function authRemove(){const d=authData();if(!d||needCrypto())return;
 openModal('Remove admin login',field('This turns off the login and deletes all temporary users. Your shop data is not touched. Enter your admin password to confirm.','cp','password','',{required:true}),'Remove login',fd=>{const cp=String(fd.get('cp')||'');
  (async()=>{try{const x=authData();if((await pw(cp,x.admin.salt))!==x.admin.hash){toast('Password is wrong.');return;}localStorage.removeItem(AUTHKEY);session=null;try{sessionStorage.removeItem(SESSKEY);}catch(e){}closeModal();applyRole();render();toast('Admin login removed.');}catch(e){toast('Could not remove the login.');}})();return false;});}
const DUR='<option value="1">1 hour</option><option value="4">4 hours</option><option value="8">8 hours</option><option value="24" selected>1 day</option><option value="72">3 days</option><option value="168">7 days</option><option value="720">30 days</option>';
function tuAdd(){if(needCrypto())return;
 openModal('Add temporary user',field('Username','u','text','',{required:true})+field('Password (min 6 characters)','p','password','',{required:true})+'<div class="field full"><label>Access lasts</label><select name="hrs">'+DUR+'</select></div>','Create user',fd=>{
  const u=String(fd.get('u')||'').trim(),p=String(fd.get('p')||''),hrs=Number(fd.get('hrs'))||24,d=authData();
  if(!d){toast('Create the admin login first.');return false;}
  if(u.length<3){toast('Username needs at least 3 characters.');return false;}if(p.length<6){toast('Password needs at least 6 characters.');return false;}
  if(u.toLowerCase()===d.admin.user.toLowerCase()||d.users.some(x=>x.name.toLowerCase()===u.toLowerCase())){toast('That username is already used.');return false;}
  (async()=>{try{const x=authData(),salt=rnd(8),t=nowMs();x.users.push({id:'t'+t.toString(36)+rnd(2),name:u,salt,hash:await pw(p,salt),created:t,expires:t+hrs*3600000});authSave(x);closeModal();render();toast('Temporary user created.');}catch(e){toast('Could not create the user.');}})();return false;});}
function tuExtend(id){const d=authData();const u=d&&d.users.find(x=>x.id===id);if(!u)return;
 openModal('Extend access for '+u.name,'<div class="field full"><label>Add more time</label><select name="hrs">'+DUR+'</select></div>','Extend',fd=>{const hrs=Number(fd.get('hrs'))||24,x=authData(),t=x.users.find(y=>y.id===id);if(!t)return false;t.expires=Math.max(nowMs(),t.expires)+hrs*3600000;authSave(x);toast('Access extended.');return true;});}

function addCustomer(id=null){const c=id?customerBy(id):null;openModal(c?'Edit customer':'Add customer',`<div class="formgrid">${field('Customer name','name','text',c?.name||'',{required:true})}${field('Phone','phone','text',c?.phone||'')}${field('Email','email','email',c?.email||'')}${field('Credit limit ('+db.settings.currency+', 0 = no limit)','creditLimit','number',c?((c.creditLimit||0)/100).toFixed(2):'0.00',{min:0,step:'.01'})}${field('Notes','notes','text',c?.notes||'',{full:true})}</div>`,c?'Save changes':'Add customer',fd=>{const name=String(fd.get('name')).trim();if(db.customers.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.id!==c?.id)){toast('Customer name already exists.');return false;}const creditLimit=Math.max(0,cents(fd.get('creditLimit')));if(c)Object.assign(c,{name,phone:fd.get('phone'),email:fd.get('email'),notes:fd.get('notes'),creditLimit});else db.customers.push({id:uid('customer'),name,phone:fd.get('phone'),email:fd.get('email'),notes:fd.get('notes'),creditLimit});toast(c?'Customer updated.':'Customer added.');});}

function newSale(){
if(!activeProducts().length){toast('Add a product before recording a sale.');navigate('products');return;}
let lines=[];const AP=activeProducts();
const customerOptions=db.customers.map(c=>({value:c.id,label:c.name}));
const productOptions=AP.map(p=>({value:p.id,label:`${p.name} · ${money(p.price)} · Stock ${p.stock}`}));
const body=`<div class="formgrid">${field('Customer','customerId','select',db.customers[0]?.id,{required:true,options:customerOptions})}<div class="field full"><label>Quick add — scan barcode or type SKU / name, then press Enter</label><input id="quickAdd" placeholder="e.g. MIL-0001" autocomplete="off"></div><div class="field full"><label>Sale items</label><div id="saleLines"></div><button type="button" class="btn" id="addSaleLine" style="margin-top:9px">＋ Add item</button></div><div class="field full"><div class="invoice-box"><div class="invoice-total"><span>Subtotal</span><strong id="saleSubtotal">${money(0)}</strong></div><div class="invoice-total"><span>Tax (${Number(db.settings.taxRate)||0}%)</span><strong id="saleTax">${money(0)}</strong></div><div class="invoice-total grand"><span>Total</span><strong id="saleTotal">${money(0)}</strong></div><div class="muted" style="font-size:12px">Submit the sale items first. You will enter the amount received in the next pop-up.</div></div></div></div>`;

if(!lines.length){toast('Add at least one sale item.');return false;}
const customer=customerBy(fd.get('customerId'));const items=[];
const want=new Map();for(const l of lines)if(l.qty>0)want.set(l.productId,(want.get(l.productId)||0)+l.qty);
if(!want.size){toast('Add at least one sale item.');return false;}
for(const [pid,qty] of want){const p=productBy(pid);if(!p){toast('Check sale item details.');return false;}if(p.stock<qty){toast(`Not enough stock for ${p.name}. Available: ${p.stock}.`);return false;}items.push({productId:p.id,name:p.name,qty,price:p.price,cost:p.cost,lineTotal:p.price*qty});}
const subtotal=items.reduce((a,i)=>a+i.lineTotal,0),taxRate=Number(db.settings.taxRate)||0,tax=Math.round(subtotal*taxRate/100),total=subtotal+tax;
// Keep the sale uncommitted until the amount received is entered in the next pop-up.
closeModal();
const paymentBody=`<div class="notice">Sale total: <strong>${money(total)}</strong>. Enter the amount the customer actually gives you. If the customer pays less, the remaining amount stays outstanding and customer contact details are required.</div><div class="formgrid"><div class="field full"><label>Amount received (${esc(db.settings.currency)})</label><input name="cash" id="saleCashReceived" type="number" min="0" step="0.01" value="${(total/100).toFixed(2)}" required inputmode="decimal"></div><div id="partialCustomerFields" class="field full hidden"><div class="notice warn">This sale will have an outstanding balance. Enter the customer's name and phone number so you can identify and follow up on the unpaid amount.</div><div class="formgrid"><div class="field"><label>Customer name</label><input name="partialCustomerName" id="partialCustomerName" autocomplete="name" placeholder="Customer full name"></div><div class="field"><label>Phone number</label><input name="partialCustomerPhone" id="partialCustomerPhone" type="tel" autocomplete="tel" placeholder="Phone number"></div></div></div><div class="field full"><div class="invoice-box"><div class="invoice-total"><span>Sale total</span><strong>${money(total)}</strong></div><div class="invoice-total"><span>Change to return</span><strong id="paymentChange">${money(0)}</strong></div><div class="invoice-total"><span>Balance remaining</span><strong id="paymentDue">${money(0)}</strong></div><div class="muted" style="font-size:12px">Change and remaining balance are calculated automatically.</div></div></div></div>`;
openModal('Payment received',paymentBody,'Confirm payment & save sale',payFd=>{
const cash=cents(payFd.get('cash'));if(cash<0){toast('Amount received cannot be negative.');return false;}
const owe=Math.max(0,total-Math.min(total,cash));let finalCustomer=customer;
if(owe>0){const name=String(payFd.get('partialCustomerName')||'').trim(),phone=String(payFd.get('partialCustomerPhone')||'').trim();if(!name||!phone){toast('For an unpaid balance, enter the customer name and phone number.');return false;}
if(!finalCustomer||finalCustomer.name==='Walk-in Customer'){
 finalCustomer=db.customers.find(c=>c.name.toLowerCase()===name.toLowerCase()&&String(c.phone||'').replace(/\s+/g,'')===phone.replace(/\s+/g,''));
 if(!finalCustomer){finalCustomer={id:uid('customer'),name,phone,email:'',notes:'Added during partial-payment checkout'};db.customers.push(finalCustomer);}else{finalCustomer.name=name;finalCustomer.phone=phone;}
}else{finalCustomer.name=name;finalCustomer.phone=phone;}
}
if(finalCustomer?.creditLimit>0&&customerDue(finalCustomer.id)+owe>finalCustomer.creditLimit){toast('Credit limit exceeded for '+finalCustomer.name+'. Limit '+money(finalCustomer.creditLimit)+', already owes '+money(customerDue(finalCustomer.id))+'.');return false;}
const saleId=uid('sale'),at=new Date().toISOString(),paid=Math.min(total,cash),change=Math.max(0,cash-total);
const sale={id:saleId,customerId:finalCustomer?.id||null,customerName:finalCustomer?.name||'Walk-in Customer',customerPhone:finalCustomer?.phone||'',items,subtotal,tax,taxRate,total,paid,cashReceived:cash,change,status:paid>=total?'PAID':paid>0?'PARTIAL':'UNPAID',at};
const inv={id:uid('invoice'),saleId,customerId:sale.customerId,customerName:sale.customerName,customerPhone:sale.customerPhone,subtotal,tax,taxRate,total,at,items:items.map(i=>({...i}))};
// Validation is complete before stock or transaction records are changed.

});
const cashInput=document.querySelector('#modalBody [name="cash"]');const changeEl=document.getElementById('paymentChange'),dueEl=document.getElementById('paymentDue'),partialFields=document.getElementById('partialCustomerFields'),nameInput=document.getElementById('partialCustomerName'),phoneInput=document.getElementById('partialCustomerPhone');const updateChange=()=>{const received=cents(cashInput?.value||0),short=received<total;if(changeEl)changeEl.textContent=money(Math.max(0,received-total));if(dueEl)dueEl.textContent=money(Math.max(0,total-Math.min(total,received)));if(partialFields)partialFields.classList.toggle('hidden',!short);if(nameInput)nameInput.required=short;if(phoneInput)phoneInput.required=short;};cashInput?.addEventListener('input',updateChange);updateChange();cashInput?.focus();return false;
});

const addLine=(pid)=>{const el=document.getElementById('saleLines');if(!el)return;const idx=lines.length;lines.push({productId:typeof pid==='number'?pid:AP[0].id,qty:1});const div=document.createElement('div');div.className='formgrid';div.style.marginBottom='10px';div.dataset.line=idx;div.innerHTML=`<div class="field"><label>Product</label><select data-line-product="${idx}">${productOptions.map(o=>`<option value="${o.value}">${esc(o.label)}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><div class="toolbar"><input type="number" min="1" step="1" value="1" data-line-qty="${idx}" style="width:100%;border:1px solid #dce2ec;border-radius:9px;padding:10px"><button class="btn small danger" type="button" data-remove-line="${idx}">×</button></div></div>`;el.appendChild(div);div.querySelector('select').value=String(lines[idx].productId);const recalc=recalcSale;div.querySelector(`[data-line-product="${idx}"]`).addEventListener('change',e=>{lines[idx].productId=Number(e.target.value);recalc();});div.querySelector(`[data-line-qty="${idx}"]`).addEventListener('input',e=>{lines[idx].qty=Math.max(1,Math.floor(Number(e.target.value)||1));recalc();});div.querySelector(`[data-remove-line="${idx}"]`).addEventListener('click',()=>{lines[idx].qty=0;div.remove();recalc();});recalc();};
document.getElementById('addSaleLine').onclick=()=>addLine();
document.getElementById('quickAdd').addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();const q=e.target.value.trim().toLowerCase();if(!q)return;let m=AP.filter(p=>(p.sku||'').toLowerCase()===q);if(!m.length)m=AP.filter(p=>p.name.toLowerCase()===q);if(!m.length)m=AP.filter(p=>p.name.toLowerCase().includes(q)||(p.sku||'').toLowerCase().includes(q));if(m.length!==1){toast(m.length?m.length+' products match — type more of the name or SKU.':'No product found for that SKU or name.');return;}const p=m[0],f=lines.findIndex(l=>l.productId===p.id&&l.qty>0);if(f>=0){lines[f].qty++;document.querySelector('[data-line-qty="'+f+'"]').value=lines[f].qty;recalcSale();}else addLine(p.id);e.target.value='';});
setTimeout(()=>document.getElementById('quickAdd')?.focus(),60);
}
function taxRows(o){return o.tax?`<div class="invoice-total"><span>Subtotal</span><strong>${money(o.subtotal)}</strong></div><div class="invoice-total"><span>Tax (${o.taxRate}%)</span><strong>${money(o.tax)}</strong></div>`:'';}
function viewSale(id){const s=db.sales.find(x=>x.id===Number(id));if(!s)return;const inv=db.invoices.find(i=>i.saleId===s.id);openModal(`Sale #${s.id}`,`<div class="invoice-box"><strong>${esc(db.settings.shopName)}</strong><p class="muted">Customer: ${esc(s.customerName)}<br>Date: ${dateTime(s.at)}<br>Invoice: ${inv?'INV-'+String(inv.id).padStart(5,'0'):'Not found'}</p>${table(['Item','Qty','Price','Line total'],s.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.lineTotal)}</td></tr>`).join(''))}${taxRows(s)}<div class="invoice-total"><span>Total</span><strong>${money(s.total)}</strong></div><div class="invoice-total"><span>Paid</span><strong>${money(s.paid)}</strong></div><div class="invoice-total"><span>Change</span><strong>${money(s.change)}</strong></div><div class="invoice-total grand"><span>Balance due</span><strong>${money(Math.max(0,s.total-s.paid))}</strong></div></div>`, 'Close',()=>true);document.getElementById('modalSubmit').classList.add('hidden');document.getElementById('modalPrint').classList.remove('hidden');}
function viewInvoice(id){const i=invoiceBy(id);if(!i)return;const paid=invPaid(i),due=invDue(i);openModal(`Invoice INV-${String(i.id).padStart(5,'0')}`,`<div class="invoice-box"><strong>${esc(db.settings.shopName)}</strong><p class="muted">Invoice: INV-${String(i.id).padStart(5,'0')}<br>Sale: #${i.saleId}<br>Customer: ${esc(i.customerName)}<br>Date: ${dateTime(i.at)}</p>${table(['Item','Qty','Price','Total'],i.items.map(it=>`<tr><td>${esc(it.name)}</td><td>${it.qty}</td><td>${money(it.price)}</td><td>${money(it.lineTotal)}</td></tr>`).join(''))}${taxRows(i)}<div class="invoice-total grand"><span>Invoice total</span><strong>${money(i.total)}</strong></div><div class="invoice-total"><span>Paid</span><strong>${money(paid)}</strong></div><div class="invoice-total"><span>Balance due</span><strong>${money(due)}</strong></div></div>`, 'Close',()=>true);document.getElementById('modalSubmit').classList.add('hidden');document.getElementById('modalPrint').classList.remove('hidden');}
function payInvoice(id){const i=invoiceBy(id);if(!i)return;const due=invDue(i);if(!due){toast('This invoice is already paid.');return;}openModal(`Record payment · INV-${String(i.id).padStart(5,'0')}`,`<div class="notice">Outstanding balance: <strong>${money(due)}</strong></div><div class="formgrid">${field('Payment amount ('+db.settings.currency+')','amount','number','',{required:true,min:0.01,step:'.01'})}${field('Payment method','method','select','Cash',{required:true,options:[{value:'Cash',label:'Cash'},{value:'Bank transfer',label:'Bank transfer'},{value:'Card',label:'Card'},{value:'E-wallet',label:'E-wallet'},{value:'Other',label:'Other'}]})}${field('Reference / note','reference','text','',{full:true})}</div>`, 'Save payment',fd=>{const amount=cents(fd.get('amount'));if(amount<=0||amount>due){toast(`Payment must be greater than zero and no more than ${money(due)}.`);return false;}db.customerPayments.push({id:uid('payment'),invoiceId:i.id,saleId:i.saleId,customerId:i.customerId,customerName:i.customerName,amount,method:fd.get('method'),reference:fd.get('reference'),at:new Date().toISOString()});idx=null;const s=db.sales.find(x=>x.id===i.saleId);if(s){s.paid=invPaid(i);s.status=s.paid>=s.total?'PAID':s.paid>0?'PARTIAL':'UNPAID';}toast('Customer payment recorded.');});}
function addPurchase(){
if(!db.suppliers.length){toast('Add a supplier first.');navigate('suppliers');return;}if(!activeProducts().length){toast('Add products first.');navigate('products');return;}
let lines=[];const supOpts=db.suppliers.map(s=>({value:s.id,label:s.name})),prodOpts=activeProducts().map(p=>({value:p.id,label:`${p.name} · unit cost ${money(p.cost)}`}));
openModal('New purchase order',`<div class="formgrid">${field('Supplier','supplierId','select',db.suppliers[0].id,{required:true,options:supOpts})}<div class="field"><label>Notes</label><input name="notes" placeholder="Optional reference"></div><div class="field full"><label>Order items</label><div id="poLines"></div><button type="button" class="btn" id="addPoLine" style="margin-top:9px">＋ Add item</button></div><div class="field full"><div class="invoice-box"><div class="invoice-total"><span>Order total</span><strong id="poTotal">${money(0)}</strong></div></div></div></div>`,'Create purchase order',fd=>{const items=[];for(const l of lines){if(l.qty<=0)continue;const p=productBy(l.productId);if(!p){toast('Select a valid product.');return false;}items.push({productId:p.id,name:p.name,qty:l.qty,received:0,cost:p.cost,lineTotal:p.cost*l.qty});}if(!items.length){toast('Add at least one item.');return false;}const supplier=supplierBy(fd.get('supplierId')),total=items.reduce((a,i)=>a+i.lineTotal,0);db.purchaseOrders.push({id:uid('po'),supplierId:supplier.id,supplierName:supplier.name,items,total,notes:fd.get('notes'),received:false,at:new Date().toISOString()});toast('Purchase order created. Receive the items when they arrive.');});
const addLine=()=>{const idx=lines.length;lines.push({productId:activeProducts()[0].id,qty:1});const el=document.getElementById('poLines'),div=document.createElement('div');div.className='formgrid';div.style.marginBottom='10px';div.innerHTML=`<div class="field"><label>Product</label><select data-po-product="${idx}">${prodOpts.map(o=>`<option value="${o.value}">${esc(o.label)}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><div class="toolbar"><input data-po-qty="${idx}" type="number" min="1" step="1" value="1" style="width:100%;border:1px solid #dce2ec;border-radius:9px;padding:10px"><button class="btn small danger" data-po-remove="${idx}" type="button">×</button></div></div>`;el.appendChild(div);const recalc=()=>{const total=lines.reduce((a,l)=>{const p=productBy(l.productId);return a+(p?.cost||0)*Math.max(0,l.qty);},0);document.getElementById('poTotal').textContent=money(total);};div.querySelector(`[data-po-product="${idx}"]`).onchange=e=>{lines[idx].productId=Number(e.target.value);recalc();};div.querySelector(`[data-po-qty="${idx}"]`).oninput=e=>{lines[idx].qty=Math.max(0,Math.floor(Number(e.target.value)||0));recalc();};div.querySelector(`[data-po-remove="${idx}"]`).onclick=()=>{lines[idx].qty=0;div.remove();recalc();};recalc();};document.getElementById('addPoLine').onclick=addLine;addLine();
}
function receivePO(id){const po=db.purchaseOrders.find(p=>p.id===Number(id));if(!po||po.received)return;const body=`<div class="notice">Receiving this order adds quantities to stock and creates a supplier bill. This prototype receives all remaining quantities at once.</div>${table(['Product','Ordered','Unit cost','Line total'],po.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.cost)}</td><td>${money(i.lineTotal)}</td></tr>`).join(''))}<p><strong>Total supplier bill: ${money(po.total)}</strong></p>`;openModal(`Receive PO-${String(po.id).padStart(5,'0')}`,body,'Confirm receipt',()=>{if(po.received){toast('This order was already received.');return false;}po.items.forEach(i=>{const p=productBy(i.productId);if(p){p.stock+=i.qty;logStock(p.id,i.qty,'Purchase received',`PO #${po.id}`);}i.received=i.qty;});po.received=true;const bill={id:uid('bill'),poId:po.id,supplierId:po.supplierId,supplierName:po.supplierName,total:po.total,items:po.items.map(i=>({...i})),at:new Date().toISOString()};db.supplierBills.push(bill);toast('Goods received, inventory updated, supplier bill created.');});}
function payBill(id){const b=db.supplierBills.find(x=>x.id===Number(id));if(!b)return;const due=billDue(b);openModal(`Pay supplier bill BILL-${String(b.id).padStart(5,'0')}`,`<div class="notice">Outstanding balance: <strong>${money(due)}</strong></div><div class="formgrid">${field('Payment amount ('+db.settings.currency+')','amount','number','',{required:true,min:.01,step:'.01'})}${field('Payment method','method','select','Bank transfer',{required:true,options:[{value:'Cash',label:'Cash'},{value:'Bank transfer',label:'Bank transfer'},{value:'Card',label:'Card'},{value:'E-wallet',label:'E-wallet'},{value:'Other',label:'Other'}]})}${field('Reference / note','reference','text','',{full:true})}</div>`,'Record payment',fd=>{const amount=cents(fd.get('amount'));if(amount<=0||amount>due){toast(`Payment must be greater than zero and no more than ${money(due)}.`);return false;}db.supplierPayments.push({id:uid('spayment'),billId:b.id,supplierId:b.supplierId,amount,method:fd.get('method'),reference:fd.get('reference'),at:new Date().toISOString()});toast('Supplier payment recorded.');});}
function viewPO(id){const p=db.purchaseOrders.find(x=>x.id===Number(id));if(!p)return;openModal(`Purchase order PO-${String(p.id).padStart(5,'0')}`,`<div class="invoice-box"><strong>${esc(p.supplierName)}</strong><p class="muted">${dateTime(p.at)}<br>${esc(p.notes||'No notes')}</p>${table(['Item','Ordered','Received','Unit cost','Total'],p.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${i.received||0}</td><td>${money(i.cost)}</td><td>${money(i.lineTotal)}</td></tr>`).join(''))}<div class="invoice-total grand"><span>Total</span><strong>${money(p.total)}</strong></div></div>`,'Close',()=>true);document.getElementById('modalSubmit').classList.add('hidden');document.getElementById('modalPrint').classList.remove('hidden');}
function download(name,text,type='application/json'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}
function exportJSON(){download('mini-shop-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2));toast('Backup exported.');}
function exportCSV(rows,name){const csv=rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');download(name,csv,'text/csv;charset=utf-8;');}
function restore(){document.getElementById('restoreFile').click();}
document.getElementById('content').addEventListener('change',async e=>{if(e.target.id!=='restoreFile')return;const file=e.target.files[0];if(!file)return;try{const incoming=JSON.parse(await file.text());if(!incoming||typeof incoming!=='object'||Array.isArray(incoming)||!Array.isArray(incoming.products)||!Array.isArray(incoming.sales)||!Array.isArray(incoming.customers)||!Array.isArray(incoming.invoices))throw Error('This does not look like a complete Mini Shop backup.');const collections=['products','customers','suppliers','sales','invoices','customerPayments','purchaseOrders','supplierBills','supplierPayments','stockMovements'];for(const k of collections){if(incoming[k]!==undefined&&!Array.isArray(incoming[k]))throw Error('Invalid backup section: '+k);}if(incoming.products.some(x=>!x||typeof x!=='object'||!Number.isFinite(Number(x.id))||!String(x.name||'').trim())||incoming.sales.some(x=>!x||typeof x!=='object'||!Array.isArray(x.items)))throw Error('Backup contains invalid product or sales records.');if(!confirm('Restore this backup and replace the current data in this browser? Export a backup first if you need the current data.'))return;const previous=db;try{db=incoming;normalize();fixCounters();fillSkus();save();render();toast('Backup restored.');}catch(restoreError){db=previous;throw restoreError;}}catch(err){toast('Could not restore: '+err.message);}finally{e.target.value='';}});
document.getElementById('content').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
switch(a){case'auth-create':authCreate();break;case'auth-change':authChange();break;case'auth-recovery':authRecoveryNew();break;case'auth-signout':signOut();break;case'auth-remove':authRemove();break;case'tu-add':tuAdd();break;case'tu-extend':tuExtend(id);break;case'tu-remove':tuRemove(id);break;case'pin-set':pinSet();break;case'pin-lock':showLock();break;case'pin-remove':pinRemove();break;case'go-checkout':navigate('checkout');break;case'go-products':navigate('products');break;case'go-reports':navigate('reports');break;case'add-product':addProduct();break;case'edit-product':addProduct(Number(id));break;case'adjust-stock':adjustStock(Number(id));break;case'archive-product':toggleArchive(Number(id));break;case'delete-product':deleteProduct(Number(id));break;case'new-sale':newSale();break;case'view-sale':viewSale(Number(id));break;case'pay-invoice':payInvoice(Number(id));break;case'view-invoice':viewInvoice(Number(id));break;case'add-customer':addCustomer();break;case'edit-customer':addCustomer(Number(id));break;case'view-customer':viewCustomer(Number(id));break;case'add-supplier':addSupplier();break;case'edit-supplier':addSupplier(Number(id));break;case'add-purchase':addPurchase();break;case'receive-po':receivePO(Number(id));break;case'view-po':viewPO(Number(id));break;case'pay-bill':payBill(Number(id));break;case'backup':exportJSON();break;case'restore':restore();break;case'reset-data':if(confirm('Permanently reset all Mini Shop data in this browser? Export a backup first if needed.')){db=defaults();save();navigate('dashboard');toast('App data reset.');}break;case'export-invoices':exportCSV([['Invoice','Sale','Customer','Date','Total','Paid','Due','Status'],...db.invoices.map(i=>[i.id,i.saleId,i.customerName,i.at,i.total/100,invPaid(i)/100,invDue(i)/100,invDue(i)===0?'Paid':invPaid(i)>0?'Partial':'Unpaid'])],'mini-shop-invoices.csv');break;case'export-report':exportCSV([['Sale ID','Date','Customer','Total','Paid','Balance','Estimated Cost','Estimated Gross Profit'],...db.sales.map(s=>[s.id,s.at,s.customerName,s.total/100,s.paid/100,Math.max(0,s.total-s.paid)/100,s.items.reduce((a,i)=>a+i.cost*i.qty,0)/100,s.items.reduce((a,i)=>a+(i.price-i.cost)*i.qty,0)/100])],'mini-shop-sales-report.csv');break;}
});
let searchT;document.getElementById('content').addEventListener('input',e=>{const t={productSearch:'#productTable',salesSearch:'#salesTable',invoiceSearch:'#invoiceTable',customerSearch:'#customerTable'}[e.target.id];if(!t)return;const q=e.target.value.toLowerCase();clearTimeout(searchT);searchT=setTimeout(()=>{document.querySelectorAll(t+' tbody tr').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';});},120);});
document.getElementById('content').addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();const fd=new FormData(e.target);db.settings.shopName=String(fd.get('shopName')).trim()||'My Shop';db.settings.currency=fd.get('currency');db.settings.taxRate=Number(fd.get('taxRate'))||0;save();render();toast('Settings saved.');}});
try {
  render();
  if (!storageAvailable && !document.getElementById('storageWarning')) {
    const note=document.createElement('div');
    note.id='storageWarning';note.className='notice warn';
    note.textContent='Device storage is unavailable here, so changes may not survive closing the app. Open the app in a normal browser window and export backups regularly.';
    document.getElementById('content').prepend(note);
  }
} catch (err) {
  console.error('Mini Shop startup error:', err);
  document.getElementById('content').innerHTML='<section class="card"><div class="card-body"><h2>Mini Shop could not start</h2><p>JavaScript startup error: '+String(err && err.message || err).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p><p>Please open the downloaded HTML file directly in Chrome.</p></div></section>';
}
window.addEventListener('error', function(ev) {
  console.error('Mini Shop runtime error:', ev.error || ev.message);
  const t=document.getElementById('toast');
  if(t){t.textContent='App error: '+(ev.message||'unknown error');t.classList.add('show');}
});
});
</script>
